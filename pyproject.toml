[project]
name = "marketintel"
version = "0.1.0"
description = "Persian Telegram market intelligence & opportunity aggregation platform"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "requests>=2.32,<3"]

[project.optional-dependencies]
mtproto = ["telethon>=1.36"]
dev = ["ruff>=0.6", "mypy>=1.10", "types-requests"]

[project.scripts]
marketintel = "marketintel.cli:main"

[tool.setuptools.package-data]
marketintel = ["data/*.json", "migrations/*.sql", "admin/templates/*.html"]

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
